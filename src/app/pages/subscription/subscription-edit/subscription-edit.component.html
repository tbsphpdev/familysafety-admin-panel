<div class="card">
  <div class="card-header">
    <h4 class="card-title mb-0">Create Subscription</h4>
  </div>
  <div class="card-body">
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <div class="row">

        <div class="col-md-4 mb-3">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input class="form-control" formControlName="name" placeholder="Name">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Price <span class="text-danger">*</span></label>
          <input class="form-control" formControlName="price" type="number" placeholder="Price">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label d-block">Interval <span class="text-danger">*</span></label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" formControlName="interval" id="intervalMonthly" value="monthly"
                type="radio">
              <label class="form-check-label" for="intervalMonthly">Monthly</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" formControlName="interval" id="intervalYearly" value="yearly"
                type="radio">
              <label class="form-check-label" for="intervalYearly">Yearly</label>
            </div>
          </div>
        </div>
        <div class="col-md-12 mb-3">
          <label class="form-label">Description </label>
          <textarea class="form-control" formControlName="description" placeholder="Description" cols="30"
            rows="3"></textarea>
        </div>
      </div>
      <hr>
      <h4 class="card-title mb-3">Limitations</h4>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Max Group</label>
          <input type="number" class="form-control" formControlName="max_groups" placeholder="Max Groups">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Max Members per Group</label>
          <input type="number" class="form-control" formControlName="max_members_per_group"
            placeholder="Max Members per Group">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Max Safe Zones</label>
          <input type="number" class="form-control" formControlName="max_safe_zones" placeholder="Max Safe Zones">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Location History Days</label>
          <input type="number" class="form-control" formControlName="location_history_days"
            placeholder="Location History Days">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label d-block">Offline Support</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" formControlName="offline_support" id="offlineSupportYes" value="true"
                type="radio">
              <label class="form-check-label" for="offlineSupportYes">Yes</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" formControlName="offline_support" id="offlineSupportNo" value="false"
                type="radio">
              <label class="form-check-label" for="offlineSupportNo">No</label>
            </div>
          </div>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label d-block">Family Dashboard</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" formControlName="family_dashboard" id="familyDashboardYes" value="true"
                type="radio">
              <label class="form-check-label" for="familyDashboardYes">Yes</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" formControlName="family_dashboard" id="familyDashboardNo" value="false"
                type="radio">
              <label class="form-check-label" for="familyDashboardNo">No</label>
            </div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Max Family Members</label>
          <input type="number" class="form-control" formControlName="max_family_members"
            placeholder="Max Family Members">
        </div>
      </div>
      <hr>
      <div formArrayName="features" class="mb-4">
        <label class="form-label fw-bold">Features</label>

        <div class="row mb-2" *ngFor="let featureGroup of features.controls; let i = index; let isLast = last"
          [formGroupName]="i">
          <div class="col-md-12">
            <div class="input-group">
              <input type="hidden" formControlName="id">
              <input type="hidden" formControlName="order">
              <input type="text" formControlName="feature_name" class="form-control" placeholder="Enter Feature">

              <button *ngIf="isLast" class="btn btn-primary" type="button"
                (click)="addFeature(null, '', features.length + 1)">+</button>
              <button *ngIf="!isLast" class="btn btn-danger" type="button" (click)="removeFeature(i)">&times;</button>

            </div>
          </div>
        </div>
      </div>


      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-primary" type="submit" [disabled]="editForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Update Subscription
        </button>
      </div>

      <div *ngIf="editForm.invalid && (editForm.dirty || editForm.touched)" class="mt-2 text-danger fs-xs">
        Please fix form errors before submitting.
      </div>
    </form>
  </div>
</div>
